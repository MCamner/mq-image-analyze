[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mq-image-analyze"
version = "1.4.0"
description = "Visual reasoning infrastructure for image analysis"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.4",
    "pillow>=10.0",
    "opencv-python>=4.9",
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
mq-image = "mq_image_analyze.cli:app"
mq-image-mcp = "mq_image_analyze.mcp.server:mcp.run"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
# Upper bound, not a preference: mcp 2.0 removed mcp.server.fastmcp, which is
# where FastMCP lived through all of 1.x. mq_image_analyze/mcp/server.py builds
# its seven tools on it, and so does mq-mcp. Migrating to the 2.x server API is
# a coordinated stack decision, tracked separately — see the MCP 2.x issue.
mcp = ["mcp>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mq_image_analyze*"]

[tool.setuptools.package-data]
"mq_image_analyze.web" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
