name: Release gate parity

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate gate parity
        run: python3 scripts/check-gate-parity.py

      - name: Test parity failures
        run: python3 scripts/check-gate-parity.py --self-test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev,web,mcp]"

      - name: Run release preflight
        run: |
          ./release-check.sh --json | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["schema"]=="repo_release_check.v1" and p["status"]=="READY", p'
